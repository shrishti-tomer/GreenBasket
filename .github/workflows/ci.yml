
name: GreenBasket CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-security:
    name: Quality and Security Checks
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

      - name: Ruff static analysis
        run: ruff check .

      - name: Bandit security scan
        run: bandit -r greenbasket products store cart orders -x "*/migrations/*"

      - name: pip-audit vulnerability scan
        run: pip-audit

  deploy-to-aws:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: quality-and-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_REGION: us-east-1
      EB_APPLICATION_NAME: GreenBasket
      EB_ENVIRONMENT_NAME: greenbasket-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create deployment package
        run: |
          zip -r GreenBasket-deploy.zip . \
            -x ".git/*" \
               "venv/*" \
               ".venv/*" \
               "__pycache__/*" \
               "*/__pycache__/*" \
               "*.pyc" \
               "db.sqlite3" \
               ".env" \
               ".env.*" \
               ".ruff_cache/*" \
               "deployment_package/*" \
               "GreenBasket-latest.zip" \
               "GreenBasket-deploy.zip"

      - name: Get Elastic Beanstalk storage bucket
        run: |
          BUCKET=$(aws elasticbeanstalk create-storage-location \
            --region "$AWS_REGION" \
            --query S3Bucket \
            --output text)

          echo "EB_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Upload deployment package
        run: |
          aws s3 cp GreenBasket-deploy.zip \
            "s3://${EB_BUCKET}/GreenBasket/${GITHUB_SHA}/GreenBasket-deploy.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          VERSION_LABEL="GreenBasket-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$EB_BUCKET",S3Key="GreenBasket/${GITHUB_SHA}/GreenBasket-deploy.zip" \
            --process

          echo "VERSION_LABEL=$VERSION_LABEL" >> "$GITHUB_ENV"

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL"

      - name: Wait for deployment to complete
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name "$EB_ENVIRONMENT_NAME"

          echo "GreenBasket deployment completed successfully."
