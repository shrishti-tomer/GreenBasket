
name: GreenBasket CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: "ci-test-secret-key-not-for-production"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

      - name: Ruff static analysis
        run: ruff check .

      - name: Bandit security scan
        run: bandit -r greenbasket products store cart orders -x "*/migrations/*"

      - name: pip-audit vulnerability scan
        run: pip-audit
