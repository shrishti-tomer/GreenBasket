
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenBasket | Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f2;
            color: #26352b;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #174d35;
        }

        .search-box {
            margin: 20px 0;
        }

        input {
            padding: 12px;
            width: 70%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            background: #174d35;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5eae5;
        }

        th {
            background: #eaf2eb;
        }

        .back {
            color: #174d35;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">

        <a class="back" href="/dashboard/">← Back to Dashboard</a>

        <h1>Product Management</h1>
        <p>View and search all grocery products.</p>

        <form method="GET" class="search-box">

    <input
        type="text"
        name="search"
        placeholder="Search products..."
        value="{{ search_query }}"
    >

    <select name="category">
        <option value="">All Categories</option>

        {% for category in categories %}
        <option
            value="{{ category.category__id }}"
           {% if selected_category == category.category__id|stringformat:"s" %}selected{% endif %}
        >
            {{ category.category__name }}
        </option>
        {% endfor %}
    </select>

    <button type="submit">Search</button>

</form>

        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price (€)</th>
                    <th>Stock Quantity</th>
                </tr>
            </thead>

            <tbody>
                {% for product in products %}
                <tr>
                    <td>{{ product.name }}</td>
                    <td>{{ product.category.name }}</td>
                    <td>€{{ product.price }}</td>
                    <td>{{ product.stock_quantity }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4">No products found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</body>
</html>
